<html>
    <head> 
        <title>1 to 9 Colored Table</title> 
    </head> 
    <body> 
    <table border="1" width="500" height="300"> 
        <tr> 
            <td bgcolor="orange">1</td> 
            <td colspan="3" bgcolor="pink">2</td>
        </tr> 
        <tr> 
            <td rowspan="3" bgcolor="blue">3</td>     
            <td bgcolor="green">4</td> 
            <td bgcolor="yellow">5</td> 
            <td rowspan="3" bgcolor="gray">6</td> 
        </tr> 
        <tr> 
            <td bgcolor="red">7</td> 
            <td bgcolor="lime">8</td> 
        </tr>
        <tr> 
            <td colspan="2" bgcolor="purple">9</td>     
        </tr>
    </table> 
    </body> 
</html>
