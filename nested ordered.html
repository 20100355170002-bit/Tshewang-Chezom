<html>
	<head>
		<title>nested ordered list</title>
	</head>
	<body>
		<h2>nested ordered list</h2>
	<ol>
		<li><h3>fruits</h3></li>
		<ul>
			<li>apple</li>
			<li>oranges</li>
			<li>banana</li>
			<li>peaches</li>
		</ul>
		<li><h3>vegetable</h3></li>
		<li>potato</li>
		<li>tomato</li>	
		<li>carrot</li>
		<li>chilli</li>
	</ol>
	</body>
</html>
